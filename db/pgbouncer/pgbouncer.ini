; PgBouncer for the Arena dashboard — the ONLY internet-reachable DB endpoint.
; Implements PRD_fe §5.2 (TLS + SCRAM on the public port) and §5.3 (transaction
; pooling in front of Postgres). Postgres itself is private (compose network).
;
; Client side  (Vercel -> here): TLS required, server authenticated by the CA in
;                                DATABASE_SSL_CA (verify-full). SCRAM password.
; Server side  (here -> Postgres): plaintext over the private docker network.

[databases]
; Vercel connects to database "arena"; we route it to the private Postgres.
arena = host=db port=5432 dbname=arena

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- auth (§5.2) -----------------------------------------------------------
; Static SCRAM verifier list, generated from Postgres (db/pgbouncer/gen-userlist.sh).
; scram-sha-256 gives SCRAM pass-through: the stored verifier authenticates the
; client AND lets pgbouncer log in to Postgres — no plaintext password on disk.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- client TLS termination (§5.2) -----------------------------------------
; `require` = every client MUST use TLS. The client verifies THIS server via the
; CA we hand to Vercel (DATABASE_SSL_CA), so keep server.crt's SAN matching the
; host Vercel dials (see db/tls/gen-certs.sh <public-host>).
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key

; --- backend connection ----------------------------------------------------
; Private docker network -> plaintext is acceptable (Postgres never leaves the
; host). Flip to `require` + a CA here only if Postgres itself gets TLS.
server_tls_sslmode = disable

; --- pooling (§5.3) --------------------------------------------------------
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3

; node-postgres may send these at startup; don't reject the connection over them.
ignore_startup_parameters = extra_float_digits,search_path

; Keep the pooler itself lean; log auth failures so brute-force spikes are visible
; (the §5.2 "brute-force blunting" alert channel is: watch these logs / journald).
log_connections = 1
log_disconnections = 0
